<form role="form" name="deliveryChoiceForm">
  <script cam-script type="text/form-script">
    camForm.on('variables-fetched', function() {
      if (camForm.variableManager.variableValue('delivery_to_pickup_point') === null ||
          camForm.variableManager.variableValue('delivery_to_pickup_point') === undefined)
        camForm.variableManager.variableValue('delivery_to_pickup_point', true);
    });
  </script>
  <div class="form-group">
    <div class="checkbox">
      <label>
        <input type="checkbox"
               cam-variable-name="delivery_to_pickup_point"
               cam-variable-type="Boolean" />
        <strong>Доставка до пункта выдачи (ПВЗ)</strong>
      </label>
    </div>
    <p class="help-block">Снимите галочку, если хотите курьерскую доставку по адресу.</p>
  </div>
</form>
