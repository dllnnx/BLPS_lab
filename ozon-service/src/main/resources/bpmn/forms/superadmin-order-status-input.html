<form role="form" name="orderStatusInputForm">
  <script cam-script type="text/form-script">
    camForm.on('form-loaded', function() {
      camForm.variableManager.fetchVariable('update_order_error');
    });
    camForm.on('variables-fetched', function() {
      $scope.updateError = camForm.variableManager.variableValue('update_order_error');
      if (!camForm.variableManager.variableValue('orderId'))
        camForm.variableManager.variableValue('orderId', '1');
    });
  </script>

  <div ng-if="updateError" class="alert alert-danger">
    <strong>Ошибка обновления:</strong> {{ updateError }}
  </div>

  <div class="form-group">
    <label for="orderId">ID заказа</label>
    <input id="orderId"
           type="text"
           class="form-control"
           placeholder="Введите числовой ID заказа"
           cam-variable-name="orderId"
           cam-variable-type="String"
           required />
  </div>
  <div class="form-group">
    <label for="newStatus">Новый статус</label>
    <select id="newStatus"
            class="form-control"
            cam-variable-name="newStatus"
            cam-variable-type="String">
      <option value="NEW">NEW</option>
      <option value="PAID">PAID</option>
      <option value="PAYMENT_ERROR">PAYMENT_ERROR</option>
      <option value="CANCELLED">CANCELLED</option>
      <option value="ISSUED">ISSUED</option>
    </select>
  </div>
</form>
