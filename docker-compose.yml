services:
  db-ozon:
    image: postgres:15
    container_name: db-ozon
    environment:
      - POSTGRES_DB=study
      - POSTGRES_USER=study
      - POSTGRES_PASSWORD=study
    ports:
      - 5433:5432
    volumes:
      - db-ozon-data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U study -d study" ]
      interval: 5s
      timeout: 1s
      retries: 10
    restart: unless-stopped

  db-payment-service:
    image: postgres:15
    container_name: db-payment-service
    environment:
      - POSTGRES_DB=study
      - POSTGRES_USER=study
      - POSTGRES_PASSWORD=study
    ports:
      - 5434:5432
    volumes:
      - db-payment-service-data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U study -d study" ]
      interval: 5s
      timeout: 1s
      retries: 10
    restart: unless-stopped

  ozon-service:
    build:
      context: .
      dockerfile: ./ozon.Dockerfile
    depends_on:
      db-ozon:
        condition: service_healthy
      camunda:
        condition: service_healthy
    environment:
      - DATABASE_HOST=db-ozon
      - DATABASE_PORT=5432
      - SERVER_PORT=8080
      - PAYMENT_SERVICE_URL=http://payment-service:8081
      - PAYMENT_SERVICE_USERNAME=ozon-integration
      - PAYMENT_SERVICE_PASSWORD=ozon-secret
      - CAMUNDA_CLIENT_BASE_URL=http://camunda:8080/engine-rest
      - CAMUNDA_ADMIN_USERNAME=admin
      - CAMUNDA_ADMIN_PASSWORD=admin
      - SECRETS_GEOCODER=${SECRETS_GEOCODER:-}
    ports:
      - 8080:8080
      - 9090:9090
    networks:
      - backend

  payment-service:
    build:
      context: .
      dockerfile: ./payment-service.Dockerfile
    depends_on:
      db-payment-service:
        condition: service_healthy
      camunda:
        condition: service_healthy
    environment:
      - DATABASE_HOST=db-payment-service
      - DATABASE_PORT=5432
      - SERVER_PORT=8081
      - CAMUNDA_CLIENT_BASE_URL=http://camunda:8080/engine-rest
      - CAMUNDA_ADMIN_USERNAME=admin
      - CAMUNDA_ADMIN_PASSWORD=admin
    ports:
      - 8081:8081
      - 9091:9090
    networks:
      - backend

  camunda:
    build:
      context: .
      dockerfile: ./camunda.Dockerfile
    container_name: camunda
    ports:
      - "8082:8080"
    networks:
      - backend
    restart: unless-stopped
    environment:
      CAMUNDA_BPM_RUN_EXAMPLE_ENABLED: "false"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/engine-rest/engine > /dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

